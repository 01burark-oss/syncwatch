<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SyncWatch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Giriş -->
  <section id="join" class="join">
    <div class="joinCard">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="currentColor"/><path d="M26 20l18 12-18 12z" fill="#000000"/></svg>
      </div>
      <h1>SyncWatch</h1>
      <p id="joinLead" class="lead">Uzaktayken de aynı anda izleyin.</p>
      <form id="joinForm" autocomplete="off">
        <label class="field">
          <span>Adın</span>
          <input id="nameInput" maxlength="32" required autocomplete="nickname" placeholder="Adını yaz">
        </label>
        <label id="roomField" class="field">
          <span>Oda adı</span>
          <input id="roomInput" maxlength="64" required>
        </label>
        <button class="primary big" type="submit">Odaya gir</button>
      </form>
      <p class="hint">Video dosyası internete yüklenmez. İkiniz de kendi cihazınızdaki dosyayı seçersiniz.</p>
    </div>
  </section>

  <!-- Oda -->
  <main id="app" class="app" hidden>
    <header class="bar">
      <div class="roomInfo">
        <span id="roomLabel" class="roomLabel"></span>
        <span class="roomSub"><span id="connDot" class="dot" title="Bağlanıyor"></span><span id="roomSub">Bağlanıyor…</span></span>
      </div>
      <div id="people" class="people"></div>
      <button id="copyLink" class="ghost" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span>Davet et</span>
      </button>
    </header>

    <div class="stage">
      <section class="playerCol">
        <div id="videoWrap" class="videoWrap empty">
          <video id="video" controls playsinline preload="auto"></video>

          <div id="placeholder" class="dropzone">
            <label class="pick">
              <input id="fileInput" type="file" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
              <strong>İzlenecek dosyayı seç</strong>
              <span>ya da buraya sürükle</span>
            </label>

            <div id="offer" class="offer" hidden>
              <span class="or">ya da</span>
              <p id="offerText"></p>
              <button id="offerBtn" class="primary" type="button">İndir ve izle</button>
              <small id="offerNote"></small>
            </div>

            <div id="download" class="download" hidden>
              <p id="dlTitle" class="dlTitle"></p>
              <div class="progress"><div id="dlBar"></div></div>
              <p id="dlLine" class="dlLine"></p>
              <div class="dlActions">
                <button id="dlRetry" class="primary" type="button" hidden>Devam et</button>
                <button id="dlCancel" class="ghost" type="button">Vazgeç</button>
              </div>
            </div>
          </div>

          <div id="readyOverlay" class="overlay" hidden>
            <button id="readyBtn" class="primary big" type="button">Hazırım</button>
            <span>Herkes hazır olunca biri oynatsın.</span>
          </div>

          <div id="toast" class="toast" hidden></div>
        </div>

        <div id="fileBar" class="fileBar" hidden>
          <span id="fileName" class="fileName"></span>
          <span id="syncState" class="syncState"></span>
          <span id="uploadInfo" class="uploadInfo" hidden></span>
          <button id="uploadBtn" class="ghost small deskOnly" type="button" hidden>Odaya yükle</button>
          <span class="spacer"></span>
          <a id="saveLink" class="ghost small deskOnly" hidden>Cihaza kaydet</a>
          <label class="ghost small deskOnly">
            <input id="subInput" type="file" accept=".srt,.vtt">
            Altyazı
          </label>
          <label class="ghost small deskOnly">
            <input id="fileInput2" type="file" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v">
            Değiştir
          </label>
          <button id="moreBtn" class="iconBtn mobileOnly" type="button" aria-label="Seçenekler">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
        </div>
        <div id="upProgress" class="upProgress" hidden><div></div></div>

        <div id="fileWarn" class="notice" hidden></div>
      </section>

      <aside class="chat">
        <div class="chatHead">Sohbet</div>
        <div id="messages" class="messages">
          <p id="chatEmpty" class="chatEmpty">Henüz mesaj yok.</p>
        </div>
        <form id="chatForm" class="composer">
          <input id="chatInput" maxlength="1000" autocomplete="off" placeholder="Bir şey yaz…" enterkeyhint="send">
          <button class="send" type="submit" aria-label="Gönder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m0 0-5-5m5 5-5 5"/></svg>
          </button>
        </form>
      </aside>
    </div>
  </main>

  <!-- Telefonda seçenekler alttan açılan panelde -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheetBackdrop" data-close></div>
    <div class="sheetPanel" role="dialog" aria-label="Seçenekler">
      <div class="sheetGrip"></div>
      <p id="sheetFile" class="sheetFile"></p>
      <button id="sUpload" class="sheetRow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4 4 0 0 1-.5 8M12 12v9m0-9-3 3m3-3 3 3"/></svg>
        <span><strong id="sUploadTitle">Odaya yükle</strong><small id="sUploadSub">Karşı taraf istediği zaman indirebilir</small></span>
      </button>
      <button id="sSub" class="sheetRow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 13h4M13 13h4M7 16h7"/></svg>
        <span><strong>Altyazı ekle</strong><small>.srt veya .vtt dosyası</small></span>
      </button>
      <button id="sChange" class="sheetRow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 7l4-4M4 7l4 4M20 17H4m16 0-4-4m4 4-4 4"/></svg>
        <span><strong>Başka dosya seç</strong></span>
      </button>
      <a id="sSave" class="sheetRow" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
        <span><strong>Cihaza kaydet</strong></span>
      </a>
      <button id="sInvite" class="sheetRow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span><strong>Davet linkini paylaş</strong></span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="transfer.js"></script>
</body>
</html>
